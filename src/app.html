<title>Plan Picker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0B0A09">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: an app shell in the Soulcurrent "Gold Dust" language — warm black and bone, citrine used only for what is chosen.
   The plan fills the screen; a floating dock holds tagging; tags are keyed to a selection schedule. */
:root{
  /* dark-first: Gold Dust */
  --bg:#0B0A09; --raise:#131210; --card:#1A1815; --line:#2A2622; --line2:#3A352F;
  --text:#EFE8DA; --body:#BDB4A5; --muted:#9A9080; --faint:#615A50;
  --gold:#F5C928; --gold2:#FFE34A; --gold-ink:#0B0A09; --sage:#A3B39A; --rose:#C08A76;
  --scrim:rgba(5,4,3,.62); --planfilter:invert(.9) hue-rotate(180deg) sepia(.12);
  --dust1:245,201,40; --dust2:239,232,218;
  /* tag capsules sit on drawings, so they keep one look in both themes */
  --tag-bg:#0B0A09; --tag-fg:#EFE8DA; --tag-on:#F5C928; --tag-on-fg:#0B0A09; --tag-alt:#A3B39A;
  --serif:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  --sans:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  /* Linen with a clay accent */
  --bg:#E8E2D7; --raise:#EEE9E0; --card:#F3EFE8; --line:#D3CBBE; --line2:#C4BBAD;
  --text:#2A2620; --body:#544D44; --muted:#7B7266; --faint:#A0978A;
  --gold:#A85A32; --gold2:#C27A52; --gold-ink:#F7F2EA; --sage:#5E7352; --rose:#9B4A34;
  --scrim:rgba(42,38,32,.38); --planfilter:none; --dust1:168,90,50; --dust2:42,38,32; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#E8E2D7; --raise:#EEE9E0; --card:#F3EFE8; --line:#D3CBBE; --line2:#C4BBAD;
  --text:#2A2620; --body:#544D44; --muted:#7B7266; --faint:#A0978A;
  --gold:#A85A32; --gold2:#C27A52; --gold-ink:#F7F2EA; --sage:#5E7352; --rose:#9B4A34;
  --scrim:rgba(42,38,32,.38); --planfilter:none; --dust1:168,90,50; --dust2:42,38,32; color-scheme:light}
:root.paper{--planfilter:none}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:1.5px solid var(--gold);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cap{font:500 10.5px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.serif{font-family:var(--serif);font-weight:400}
.num{font-variant-numeric:tabular-nums}

#app{height:100%;display:flex;flex-direction:column}
header.top{position:relative;flex:none;border-bottom:1px solid var(--line);background:var(--bg);overflow:hidden}
canvas.dust{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tb{position:relative;display:flex;align-items:flex-end;gap:12px;padding-block:14px 6px;max-width:1360px;margin:0 auto}
.ident{flex:1;min-width:0;display:grid;gap:4px}
.projbtn{display:flex;align-items:baseline;gap:8px;background:none;border:0;padding:0;text-align:left;min-width:0;color:var(--text)}
.projbtn .nm{font:400 28px/1.05 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;letter-spacing:-.005em}
.projbtn svg{flex:none;color:var(--muted);transform:translateY(-3px)}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center;color:var(--body);flex:none}
.tabs{position:relative;display:flex;gap:22px;max-width:1360px;margin:0 auto;padding-block:6px 0}
.tab{background:none;border:0;padding:8px 0 10px;font:500 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);border-bottom:1.5px solid transparent}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--gold)}
.tab i{font-style:normal;color:var(--faint);margin-left:5px;letter-spacing:.04em}
.banner{flex:none;font-size:13px;color:var(--body);padding-block:8px;border-bottom:1px solid var(--line);background:var(--raise)}
.banner>div{max-width:1360px;margin:0 auto}
.banner b{color:var(--text);font-weight:500}
main{flex:1;min-height:0;position:relative}
.scroll{height:100%;overflow:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:1360px;margin:0 auto;padding-block:18px 120px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line2);background:transparent;color:var(--text);border-radius:999px;padding:9px 16px;font-weight:500;font-size:14px;white-space:nowrap;line-height:1.1}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn.quiet{border-color:transparent;color:var(--body)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.danger{color:var(--rose);border-color:transparent}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.hint{font-size:13px;color:var(--muted)}

/* ---------- plan ---------- */
.planview{height:100%;display:grid;grid-template-columns:minmax(0,1fr)}
@media (min-width:1000px){.planview{grid-template-columns:minmax(0,1fr) 320px}}
.vpwrap{position:relative;min-width:0;min-height:0;overflow:hidden}
.vp{position:absolute;inset:0;touch-action:none;overflow:hidden;cursor:grab}
.vp.tagging{cursor:crosshair}
.layer{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.layer img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none;filter:var(--planfilter);pointer-events:none;border-radius:2px}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-50%) scale(var(--iz,1));transform-origin:50% 50%;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:6px;touch-action:none}
.tag .cap2{display:flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;background:var(--tag-bg);color:var(--tag-fg);font:600 11px/1 var(--sans);letter-spacing:.06em;box-shadow:0 0 0 1px rgba(239,232,218,.28),0 2px 8px rgba(0,0,0,.35);white-space:nowrap}
.tag .cap2 .d{width:6px;height:6px;border-radius:50%;border:1.2px solid var(--tag-fg);opacity:.7}
.tag.s1 .cap2,.tag.s2 .cap2{background:var(--tag-on);color:var(--tag-on-fg);box-shadow:0 0 0 1px rgba(11,10,9,.5),0 2px 10px rgba(245,201,40,.35)}
.tag.s1 .cap2 .d{border-color:var(--tag-on-fg);background:var(--tag-on-fg);opacity:.9}
.tag.s2 .cap2 .d{border:0;background:var(--tag-alt);opacity:1;box-shadow:0 0 0 1.5px var(--tag-on-fg)}
.tag .lb{font:500 10.5px/1.15 var(--sans);color:var(--tag-fg);background:rgba(11,10,9,.78);padding:2px 6px;border-radius:4px;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag.sel .cap2{outline:2px solid var(--tag-on);outline-offset:3px}
.tag.new .cap2{animation:pop .35s ease-out}
.tag.dragging{opacity:.85}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.tag.new .cap2{animation:none}}
.hud{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;display:grid;gap:6px;z-index:3}
.hud button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:color-mix(in srgb,var(--raise) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;color:var(--text);font-size:17px}
.hud button[aria-pressed="true"]{color:var(--gold);border-color:var(--gold)}
.dock{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:6px;align-items:center;padding:6px;border-radius:999px;background:color-mix(in srgb,var(--raise) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line2);box-shadow:0 10px 40px rgba(0,0,0,.35);z-index:4;max-width:calc(100% - 24px)}
.dock .roomb{display:flex;align-items:center;gap:6px;border:0;background:transparent;padding:8px 12px;border-radius:999px;min-width:0;max-width:150px}
.dock .roomb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.dock .roomb .cap{flex:none}
.dock .tagbtn{display:flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:10px 18px;background:var(--text);color:var(--bg);font-weight:600;font-size:14px;white-space:nowrap}
.dock .tagbtn[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}
.dock .tagbtn .ring{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center}
.dock .tagbtn[aria-pressed="true"] .ring::after{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.dock .listb{border:0;background:transparent;padding:8px 12px;border-radius:999px;font-size:14px;color:var(--body);white-space:nowrap}
@media (min-width:1000px){.dock .listb{display:none}}
.coach{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:3;font-size:13px;color:var(--text);background:color-mix(in srgb,var(--raise) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line2);border-radius:999px;padding:7px 14px;white-space:nowrap;max-width:calc(100% - 120px);overflow:hidden;text-overflow:ellipsis}
.tray{position:absolute;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:5;display:grid;gap:8px;justify-items:center;pointer-events:none}
.tray .tin{pointer-events:auto;width:min(680px,calc(100% - 24px));background:color-mix(in srgb,var(--raise) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line2);border-radius:18px;padding:12px 12px 10px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.tray .th{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;padding:0 4px}
.tray .th b{font:400 20px/1 var(--serif)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line2);background:transparent;border-radius:999px;padding:7px 13px;font-size:13.5px;color:var(--text);white-space:nowrap}
.chip.k{border-color:var(--gold);color:var(--gold)}
.chip:active{background:var(--card)}
.side{border-left:1px solid var(--line);overflow:auto;display:none}
@media (min-width:1000px){.side{display:block}}
.plist{display:grid;padding:8px 0 120px}
.pli{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 16px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left}
.pli:hover{background:var(--raise)}
.pli .t{font:600 11px var(--sans);letter-spacing:.06em;color:var(--muted)}
.pli .n{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pli .r{font-size:12px;color:var(--muted)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);white-space:nowrap}
.st i{width:8px;height:8px;border-radius:50%;border:1.2px solid var(--muted)}
.st.s1 i{background:var(--gold);border-color:var(--gold)}
.st.s2 i{background:var(--gold);border-color:var(--gold);box-shadow:4px 0 0 -1px var(--sage)}
.empty{display:grid;justify-items:center;gap:14px;text-align:center;padding:56px 20px;position:relative}
.empty h2{font:400 34px/1.1 var(--serif);margin:0;text-wrap:balance}
.empty h2 em{font-style:italic;color:var(--gold)}
.empty p{margin:0;color:var(--body);max-width:44ch}
.empty .cap{margin-bottom:-4px}

/* ---------- library ---------- */
.lhead{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:8px}
.lhead h2{font:400 30px/1.1 var(--serif);margin:0;flex:1;min-width:220px}
section.blk{margin-top:26px}
section.blk>header{display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:14px}
.src{margin-bottom:18px}
.src .hd{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.src .hd b{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pages{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.pg{flex:none;width:104px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0;position:relative;overflow:hidden}
.pg canvas{width:100%;height:136px;object-fit:contain;display:block}
.pg span{position:absolute;left:6px;bottom:6px;font:600 10px var(--sans);background:var(--bg);color:var(--text);padding:3px 6px;border-radius:999px}
.pg em{position:absolute;right:6px;top:6px;font:600 10px var(--sans);font-style:normal;background:var(--gold);color:var(--gold-ink);padding:3px 6px;border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.opt{background:none;border:0;padding:0;text-align:left;display:grid;gap:8px;align-content:start;min-width:0}
.opt .im{background:#F7F4EE;border-radius:12px;aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line);max-width:100%}
.opt .im img{max-width:88%;max-height:88%;object-fit:contain}
.opt .nm{font-size:14px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.opt .mt{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt .use{display:flex;gap:4px;flex-wrap:wrap}
.opt .use i{font:600 10px var(--sans);font-style:normal;padding:3px 7px;border-radius:999px;background:var(--gold);color:var(--gold-ink)}
.opt .use i.b{background:transparent;color:var(--sage);box-shadow:inset 0 0 0 1px var(--sage)}
.opt[aria-current="true"] .im{outline:2px solid var(--gold);outline-offset:2px}
.search{width:100%;padding:11px 16px;border:1px solid var(--line2);border-radius:999px;background:transparent}

/* ---------- schedule ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:14px 0 4px}
.stat{padding:14px 4px}
.stat b{display:block;font:400 30px/1 var(--serif);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.room{margin-top:30px}
.room h3{font:400 24px/1.1 var(--serif);margin:0 0 4px;font-style:italic}
.srow{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.srow .tg{font:600 11px var(--sans);letter-spacing:.06em;color:var(--muted);padding-top:3px;text-align:left;background:none;border:0}
.srow .it{font-size:15px}
.srow .it small{color:var(--muted);margin-left:8px;font-size:12.5px}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
@media (max-width:560px){.picks{grid-template-columns:1fr}}
.pk{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:center;min-width:0}
.pk .th{width:64px;height:50px;background:#F7F4EE;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.pk .th img{max-width:90%;max-height:90%;object-fit:contain}
.pk .k{font:500 9.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:3px}
.pk.b .k{color:var(--sage)}
.pk .v{font-size:13.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk .p{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk.none .th{background:transparent;border-style:dashed}
.pk.none .v{color:var(--faint)}

/* ---------- sheets / modals ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;z-index:41;background:var(--raise);display:flex;flex-direction:column;left:0;right:0;bottom:0;max-height:88%;border-radius:22px 22px 0 0;border-top:1px solid var(--line2);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -10px 40px rgba(0,0,0,.4)}
.sheet::before{content:"";width:36px;height:4px;border-radius:2px;background:var(--line2);margin:8px auto 0;flex:none}
@media (min-width:900px){.sheet{left:auto;top:0;width:420px;max-height:none;border-radius:0;border-top:0;border-left:1px solid var(--line2);padding-top:env(safe-area-inset-top,0px)}.sheet::before{display:none}}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:12px 0 6px}
.sheet .sb{overflow:auto;padding-block:6px 22px;display:grid;gap:18px}
.sheet .sh,.sheet .sb{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.tagid{font:600 12px var(--sans);letter-spacing:.08em;color:var(--muted)}
.ptitle{font:400 30px/1.05 var(--serif);border:0;background:transparent;width:100%;padding:0;color:var(--text)}
.ptitle::placeholder{color:var(--faint)}
.fld{display:grid;gap:6px}
.fld input,.fld textarea{width:100%;padding:10px 14px;border:1px solid var(--line2);border-radius:12px;background:var(--bg)}
.fld textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:10px}
.slot{border:1px solid var(--line2);border-radius:16px;overflow:hidden}
.slot .sl{display:flex;align-items:center;gap:8px;padding:10px 14px 0}
.slot .sl .cap{color:var(--gold)}
.slot.b .sl .cap{color:var(--sage)}
.slot .sc{display:grid;grid-template-columns:100px minmax(0,1fr);gap:12px;padding:10px 14px 14px;align-items:center;width:100%;background:none;border:0;text-align:left}
.slot .sc .th{width:100px;height:76px;background:#F7F4EE;border-radius:10px;display:grid;place-items:center;overflow:hidden}
.slot .sc .th img{max-width:90%;max-height:90%;object-fit:contain}
.slot .sc .nm{font-size:15px;line-height:1.3}
.slot .sc .mt{font-size:12.5px;color:var(--muted)}
.slot .choose{width:100%;padding:16px 14px 18px;border:0;background:none;color:var(--text);text-align:left;font-size:14.5px}
.slot .choose span{color:var(--muted)}
.modal{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:900px){.modal{inset:4vh 5vw;border-radius:22px;border:1px solid var(--line2);box-shadow:0 30px 80px rgba(0,0,0,.5)}}
.modal .mh{display:flex;align-items:center;gap:10px;padding-block:14px;border-bottom:1px solid var(--line)}
.modal .mh h2{font:400 24px/1.1 var(--serif);margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal .mb{flex:1;overflow:auto;padding-block:18px 40px}
.modal .mh,.modal .mb{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.pop{position:fixed;z-index:45;background:var(--raise);border:1px solid var(--line2);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.45);padding:8px;display:grid;gap:2px;width:min(360px,calc(100vw - 24px))}
.pop .mi{display:flex;gap:10px;align-items:center;text-align:left;width:100%;padding:10px 12px;border:0;background:none;border-radius:12px;font-size:14.5px}
.pop .mi:hover{background:var(--card)}
.pop .mi[aria-current="true"]::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);margin-left:auto}
.pop .mi small{color:var(--muted);margin-left:auto;font-size:11px}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.pop form{display:flex;gap:6px;padding:6px 4px}
.pop input{flex:1;min-width:0;padding:9px 14px;border:1px solid var(--line2);border-radius:999px;background:var(--bg)}
.pop .cap{padding:8px 12px 4px}
.seg{display:flex;border:1px solid var(--line2);border-radius:999px;padding:3px;gap:2px}

/* ================= storage ================= */
// A document store with the same surface as the artifact's db capability.
function makeMemDB(hooks = {}, initial) {
  const data = initial || new Map(), ls = new Set();
  const parent = p => p.split("/").slice(0, -1).join("/");
  const snap = c => ({ docs: [...data].filter(([p]) => parent(p) === c).map(([p, d]) => ({ id: p.split("/").pop(), exists: true, data: () => d })) });
  const notify = c => { for (const l of ls) if (l.c === c) l.cb(snap(c)); };
  const doc = p => ({ id: p.split("/").pop(), path: p,
    get: async () => ({ exists: data.has(p), data: () => data.get(p) }),
    set: async d => { const v = JSON.parse(JSON.stringify(d)); data.set(p, v); await hooks.put?.(p, v); notify(parent(p)); },
    update: async d => { const v = { ...(data.get(p) || {}), ...JSON.parse(JSON.stringify(d)) }; data.set(p, v); await hooks.put?.(p, v); notify(parent(p)); },
    delete: async () => { data.delete(p); await hooks.del?.(p); notify(parent(p)); } });
  return { doc, collection: c => ({ doc: id => doc(c + "/" + (id || uid())), get: async () => snap(c),
    onSnapshot(cb) { const l = { c, cb }; ls.add(l); setTimeout(() => ls.has(l) && cb(snap(c))); return () => ls.delete(l); } }) };
}
// IndexedDB: docs and files saved on this device.
function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("plan-picker", 1);
    r.onupgradeneeded = () => { r.result.createObjectStore("docs"); r.result.createObjectStore("blobs"); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
const idbReq = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function makeIDB() {
  const idb = await idbOpen();
  const tx = (s, m = "readonly") => idb.transaction(s, m).objectStore(s);
  const data = new Map();
  const keys = await idbReq(tx("docs").getAllKeys()), vals = await idbReq(tx("docs").getAll());
  keys.forEach((k, i) => data.set(k, vals[i]));
  const db = makeMemDB({ put: (p, v) => idbReq(tx("docs", "readwrite").put(v, p)), del: p => idbReq(tx("docs", "readwrite").delete(p)) }, data);
  return {
    db,
    async putBlob(blob) { const ref = "idb:" + uid(); await idbReq(tx("blobs", "readwrite").put(blob, ref)); blobs[ref] = URL.createObjectURL(blob); return ref; },
    async delBlob(ref) { await idbReq(tx("blobs", "readwrite").delete(ref)); if (blobs[ref]) URL.revokeObjectURL(blobs[ref]); delete blobs[ref]; },
    async loadBlobs() { const ks = await idbReq(tx("blobs").getAllKeys()); for (const k of ks) { const b = await idbReq(tx("blobs").get(k)); if (b) blobs[k] = URL.createObjectURL(b); } }
  };
}

async function putBlob(blob) {

/* ================= gold dust ================= */
function drawDust() {
  const c = $("#dust"); if (!c) return; const r = c.getBoundingClientRect(), d = devicePixelRatio || 1;
  c.width = r.width * d; c.height = r.height * d; const x = c.getContext("2d"); x.scale(d, d);
  const cs = getComputedStyle(document.documentElement), a = cs.getPropertyValue("--dust1").trim(), b = cs.getPropertyValue("--dust2").trim();
  let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const n = Math.round(r.width / 9);
  for (let i = 0; i < n; i++) {
    const px = r.width * (.35 + .65 * rnd() ** .7), py = r.height * rnd(), sz = .3 + 1.2 * rnd() ** 3, al = .15 + .55 * rnd();
    x.fillStyle = `rgba(${rnd() < .55 ? a : b},${al * .08})`; x.beginPath(); x.arc(px, py, sz * 4, 0, 7); x.fill();
    x.fillStyle = `rgba(${rnd() < .55 ? a : b},${al})`; x.beginPath(); x.arc(px, py, sz, 0, 7); x.fill();
  }
}

/* ================= subscriptions ================= */
let unsubs = [];
const toList = snap => snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

  if (!S.projects.find(p => p.id === S.pid) || (S.pid === "example" && S.autoExample && real.length)) {
    const want = recall("pp.pid"), next = want && real.find(p => p.id === want) ? want : real.length ? real[real.length - 1].id : "example";
    S.autoExample = next === "example"; openProject(next);
  } else { const p = proj(); if (!S.rendered || (p.plan?.img || "") !== S.renderedPlan) render(); else renderHeader(); }
}
function openProject(pid) {
  if (pid === S.pid) return;
  unsubs.forEach(u => u()); unsubs = [];
  closeAll(); S.pid = pid; S.pins = []; S.options = []; S.sources = []; S.tagging = false; S.view = null; S.tray = null;
  if (pid !== "example") store("pp.pid", pid);
  const db = dbFor(pid), base = "projects/" + pid;
  unsubs.push(db.collection(base + "/pins").onSnapshot(s => { S.pins = toList(s).sort((a, b) => a.n - b.n); onPins(); }, e => toast("Couldn't load tags: " + errMsg(e))));
  unsubs.push(db.collection(base + "/options").onSnapshot(s => { S.options = toList(s); onOptions(); }, e => toast("Couldn't load the library: " + errMsg(e))));
  unsubs.push(db.collection(base + "/sources").onSnapshot(s => { S.sources = toList(s); if (S.tab === "library") render(); }));
  render();
}

}

/* ---------- plan: viewport with pan, pinch and wheel zoom ---------- */
function renderPlan(p) {
  const m = $("#main");
  if (!p.plan) {
    m.innerHTML = `<div class="scroll"><div class="wrap gut"><div class="empty"><span class="cap">Step one</span><h2>Bring in the <em>furniture plan</em></h2>
      <p>Upload the plan as a PDF or an image. Then tap each piece drawn on it to tag it, and choose a first pick and a backup from the vendor PDFs.</p>
      ${canUpload() ? `<button class="btn gold" data-act="upplan">Upload floorplan</button>` : `<p class="hint">Only editors of this page can upload.</p>`}</div></div></div>`;
    return;
  }
  m.innerHTML = `<div class="planview"><div class="vpwrap">
      <div class="vp ${S.tagging ? "tagging" : ""}" id="vp"><div class="layer" id="lyr"><img id="planimg" src="${esc(imgURL(p.plan.img))}" alt="Floorplan" draggable="false"><div id="tags"></div></div></div>
      <div class="coach" id="coach" ${S.tagging ? "" : "hidden"}>Tap each piece on the plan</div>
      <div class="hud">
        <button data-act="zoomin" aria-label="Zoom in">+</button><button data-act="zoomout" aria-label="Zoom out">−</button>
        <button data-act="fit" aria-label="Fit plan to screen"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
        <button data-act="labels" aria-pressed="${S.labels}" aria-label="Show names on tags"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h8M2 12h10" stroke="currentColor" stroke-width="1.4"/></svg></button>
        <button data-act="paper" aria-pressed="${document.documentElement.classList.contains("paper")}" aria-label="Show drawing on white"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="10" height="12" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 6h5M5.5 9h5" stroke="currentColor" stroke-width="1.2"/></svg></button>
      </div>
      <div class="tray" id="tray"></div>
      <div class="dock">
        <button class="roomb" data-act="roompick"><span class="cap">Room</span><span id="roomname">${esc(S.room || "Any")}</span></button>
        <button class="tagbtn" data-act="tagmode" aria-pressed="${S.tagging}"><span class="ring"></span>${S.tagging ? "Done" : "Tag pieces"}</button>
        <button class="listb" data-act="list">${S.pins.length} tagged</button>
      </div>
    </div><aside class="side" id="side"></aside></div>`;
  const img = $("#planimg");
  const start = () => { bindViewport(); if (!S.view) fitView(); else applyView(); renderTags(); renderSide(); renderTray(); };
  if (img.complete && img.naturalWidth) start(); else { img.onload = start; img.onerror = () => toast("The plan image didn't load. Try replacing the floorplan from the project menu.", 5000); }
}
function vpSize() { const v = $("#vp"); return v ? { w: v.clientWidth, h: v.clientHeight } : { w: 1, h: 1 }; }
function baseSize() { const p = proj(), { w, h } = vpSize(), ar = p.plan.w / p.plan.h; let bw = w - 32, bh = bw / ar; if (bh > h - 140) { bh = h - 140; bw = bh * ar; } return { bw: Math.max(bw, 100), bh: Math.max(bh, 100 / ar) }; }
function fitView() { const { w, h } = vpSize(), { bw, bh } = baseSize(); S.view = { z: 1, x: (w - bw) / 2, y: Math.max(12, (h - 76 - bh) / 2) }; applyView(); }
function applyView() {
  const l = $("#lyr"); if (!l || !S.view) return; const { bw, bh } = baseSize();
  l.style.width = bw + "px"; l.style.height = bh + "px";
  l.style.transform = `translate(${S.view.x}px,${S.view.y}px) scale(${S.view.z})`;
  l.style.setProperty("--iz", (1 / S.view.z).toFixed(4));
}
function zoomAt(f, cx, cy) {
  const v = S.view, z = Math.min(10, Math.max(.6, v.z * f)), k = z / v.z;
  v.x = cx - (cx - v.x) * k; v.y = cy - (cy - v.y) * k; v.z = z; applyView();
}
function toPlan(clientX, clientY) {
  const r = $("#vp").getBoundingClientRect(), { bw, bh } = baseSize(), v = S.view;
  return { x: (clientX - r.left - v.x) / (bw * v.z), y: (clientY - r.top - v.y) / (bh * v.z) };
}
function bindViewport() {
  const vp = $("#vp"); const pts = new Map(); let g = null;
  vp.addEventListener("pointerdown", e => {
    if (e.target.closest(".tag")) return;
    vp.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const r = vp.getBoundingClientRect();
    if (pts.size === 1) g = { kind: "pan", sx: e.clientX, sy: e.clientY, vx: S.view.x, vy: S.view.y, t: Date.now(), moved: false };
    else if (pts.size === 2) { const [a, b] = [...pts.values()]; g = { kind: "pinch", d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2 - r.left, my: (a.y + b.y) / 2 - r.top, z: S.view.z, vx: S.view.x, vy: S.view.y, moved: true }; }
  });
  vp.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId) || !g) return; pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const r = vp.getBoundingClientRect();
    if (g.kind === "pan" && pts.size === 1) {
      const dx = e.clientX - g.sx, dy = e.clientY - g.sy; if (Math.abs(dx) + Math.abs(dy) > 6) g.moved = true;
      if (g.moved) { S.view.x = g.vx + dx; S.view.y = g.vy + dy; applyView(); }
    } else if (g.kind === "pinch" && pts.size === 2) {
      const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2 - r.left, my = (a.y + b.y) / 2 - r.top;
      const z = Math.min(10, Math.max(.6, g.z * d / g.d)), wx = (g.mx - g.vx) / g.z, wy = (g.my - g.vy) / g.z;
      S.view.z = z; S.view.x = mx - wx * z; S.view.y = my - wy * z; applyView();
    }
  });
  const up = e => {
    if (!pts.has(e.pointerId)) return; pts.delete(e.pointerId);
    if (g && g.kind === "pan" && !g.moved && pts.size === 0 && Date.now() - g.t < 600) planTap(e);
    if (pts.size === 0) g = null; else if (pts.size === 1) { const [p] = [...pts.values()]; g = { kind: "pan", sx: p.x, sy: p.y, vx: S.view.x, vy: S.view.y, t: 0, moved: true }; }
  };
  vp.addEventListener("pointerup", up); vp.addEventListener("pointercancel", up);
  vp.addEventListener("wheel", e => { e.preventDefault(); const r = vp.getBoundingClientRect();
    const trackpadPan = !e.ctrlKey && e.deltaMode === 0 && (Math.abs(e.deltaX) > 0 || Math.abs(e.deltaY) < 40);
    if (trackpadPan) { S.view.x -= e.deltaX; S.view.y -= e.deltaY; applyView(); }
    else zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? .012 : .0018)), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
  vp.addEventListener("dblclick", e => { const r = vp.getBoundingClientRect(); if (!S.tagging) zoomAt(1.8, e.clientX - r.left, e.clientY - r.top); });
}
async function planTap(e) {
  const p = toPlan(e.clientX, e.clientY);
  if (p.x < 0 || p.x > 1 || p.y < 0 || p.y > 1) { if (S.tray) { S.tray = null; renderTray(); } return; }
  if (!S.tagging) { if (S.tray) { S.tray = null; renderTray(); } return; }
  const n = S.pins.reduce((m, q) => Math.max(m, q.n || 0), 0) + 1, id = "p" + uid();
  S.justAdded = id;
  try {
    await dbFor(S.pid).doc(`projects/${S.pid}/pins/${id}`).set({ n, item: "", room: S.room || "", qty: 1, notes: "", x: p.x, y: p.y, first: "", backup: "", createdAt: Date.now() });
    S.tray = id; renderTray();
  } catch (err) { toast("Couldn't add the tag: " + errMsg(err)); }
}
function renderTags() {
  const box = $("#tags"); if (!box) return; const { bw, bh } = baseSize();
  box.innerHTML = S.pins.map(t => `<button class="tag s${pstate(t)} ${S.sheetPin === t.id || S.tray === t.id ? "sel" : ""} ${S.justAdded === t.id ? "new" : ""}" style="left:${t.x * bw}px;top:${t.y * bh}px" data-id="${esc(t.id)}" aria-label="${esc(tagOf(t.n) + " " + (t.item || "untitled") + ", " + stateLabel(t))}">
    <span class="cap2"><span class="d"></span>${tagOf(t.n)}</span>${S.labels && t.item ? `<span class="lb">${esc(t.item)}</span>` : ""}</button>`).join("");
  S.justAdded = null;
  box.querySelectorAll(".tag").forEach(bindTag);
  const lb = document.querySelector(".listb"); if (lb) lb.textContent = S.pins.length + " tagged";
}
function bindTag(el) {
  let st = null;
  el.addEventListener("pointerdown", e => { e.stopPropagation(); el.setPointerCapture(e.pointerId); st = { sx: e.clientX, sy: e.clientY, moved: false }; });
  el.addEventListener("pointermove", e => {
    if (!st) return; if (!st.moved && Math.hypot(e.clientX - st.sx, e.clientY - st.sy) < 8) return;
    st.moved = true; el.classList.add("dragging");
    const p = toPlan(e.clientX, e.clientY), { bw, bh } = baseSize();
    st.x = Math.min(1, Math.max(0, p.x)); st.y = Math.min(1, Math.max(0, p.y));
    el.style.left = st.x * bw + "px"; el.style.top = st.y * bh + "px";
  });
  const end = async e => {
    if (!st) return; const s = st; st = null; el.classList.remove("dragging");
    if (s.moved && s.x != null) { await savePin(el.dataset.id, { x: s.x, y: s.y }); }
    else if (e.type === "pointerup") { S.tray = null; renderTray(); openSheet(el.dataset.id); }
  };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
  el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openSheet(el.dataset.id); } });
}
function renderSide() {
  const s = $("#side"); if (!s) return;
  s.innerHTML = `<div class="gut" style="padding-block:16px 6px"><span class="cap">Tagged pieces</span></div>${pinListHTML()}`;
}
function pinListHTML() {
  if (!S.pins.length) return `<p class="hint gut">Nothing tagged yet. Tap <b>Tag pieces</b>, then tap each sofa, chair, table and light drawn on the plan.</p>`;
  return `<div class="plist">${S.pins.map(t => `<button class="pli" data-act="focuspin" data-id="${esc(t.id)}"><span class="t">${tagOf(t.n)}</span><span style="min-width:0"><div class="n">${esc(t.item || "Untitled")}</div><div class="r">${esc(t.room || "No room")}</div></span><span class="st s${pstate(t)}"><i></i>${["Open","First","Both"][pstate(t)]}</span></button>`).join("")}</div>`;
}
function renderTray() {
  const tr = $("#tray"); if (!tr) return; const t = S.tray && pinById(S.tray);
  if (!t) { tr.innerHTML = ""; return; }
  const last = [...S.pins].reverse().find(q => q.id !== t.id && q.item);
  const chips = [...new Set([last?.item, ...QUICK].filter(Boolean))];
  tr.innerHTML = `<div class="tin" role="dialog" aria-label="Name ${tagOf(t.n)}">
    <div class="th"><b>${tagOf(t.n)}</b><span class="hint" style="flex:1">${t.item ? esc(t.item) + (t.room ? " · " + esc(t.room) : "") : "What is it?" + (t.room ? " · " + esc(t.room) : "")}</span>
      <button class="btn sm quiet" data-act="undotag">Undo</button><button class="btn sm" data-act="opentray">Details</button></div>
    <div class="chips">${chips.map((c, i) => `<button class="chip ${i === 0 && last && c === last.item ? "k" : ""} " data-act="quickname" data-v="${esc(c)}">${i === 0 && last && c === last.item ? "Another " + esc(c.toLowerCase()) : esc(c)}</button>`).join("")}</div></div>`;
}

/* ---------- library ---------- */
function usageOf(oid) { return S.pins.flatMap(p => [p.first === oid ? `<i>${tagOf(p.n)}</i>` : "", p.backup === oid ? `<i class="b">${tagOf(p.n)}</i>` : ""]).join(""); }
function optCard(o, act, extra = "") {
  return `<button class="opt" data-act="${act}" data-id="${esc(o.id)}" ${extra}><div class="im"><img src="${esc(imgURL(o.img))}" alt="" loading="lazy"></div>
    <div><div class="nm">${esc(o.name || "Unnamed piece")}</div><div class="mt">${esc([o.vendor, o.price].filter(Boolean).join(" · ") || o.category || "")}</div></div><div class="use">${usageOf(o.id)}</div></button>`;
}
function renderLibrary() {
  const up = canUpload();
  return `<div class="lhead"><h2>Vendor pages and pieces</h2>${up ? `<button class="btn gold" data-act="upsrc">Upload PDF or images</button>` : ""}</div>
  <p class="hint" style="margin:0;max-width:62ch">Open a page and drag a box around each product to cut it into the library. Pieces you cut become the choices for every tag.</p>
  <section class="blk"><header><span class="cap">Sources</span><span class="hint">${S.sources.length}</span></header>
    ${S.sources.length ? S.sources.map(s => `<div class="src"><div class="hd"><b>${esc(s.name)}</b><span class="hint num">${s.pages} page${s.pages > 1 ? "s" : ""}</span><span class="sp"></span>
      <span id="dz-${esc(s.id)}"><button class="btn sm danger" data-act="askdelsrc" data-id="${esc(s.id)}">Remove</button></span></div>
      <div class="pages">${Array.from({ length: s.pages }, (_, i) => { const n = S.options.filter(o => o.sourceId === s.id && o.page === i + 1).length;
        return `<button class="pg" data-act="crop" data-id="${esc(s.id)}" data-page="${i + 1}" aria-label="Open page ${i + 1}"><canvas data-thumb="${esc(s.id)}" data-page="${i + 1}" width="104" height="136"></canvas><span>${i + 1}</span>${n ? `<em>${n}</em>` : ""}</button>`; }).join("")}</div></div>`).join("")
      : `<p class="hint">No vendor PDFs yet.${up ? " Upload a furniture presentation or spec sheet to start cutting out options." : ""}</p>`}
  </section>
  <section class="blk"><header><span class="cap">Library</span><span class="hint">${S.options.length} piece${S.options.length === 1 ? "" : "s"}</span></header>
    ${S.options.length ? `<div class="grid">${S.options.map(o => optCard(o, "editopt")).join("")}</div>` : `<p class="hint">Pieces you cut from the PDFs show up here.</p>`}
  </section>`;
}

/* ---------- schedule ---------- */
function renderSchedule() {
  const pins = S.pins, f = pins.filter(p => p.first).length, b = pins.filter(p => p.backup).length;
  const tot = pins.reduce((a, p) => a + (p.first ? priceNum((optById(p.first) || {}).price) * (p.qty || 1) : 0), 0);
  const totB = pins.reduce((a, p) => { const o = optById(p.backup) || optById(p.first); return a + (o ? priceNum(o.price) * (p.qty || 1) : 0); }, 0);
  const rooms = {}; pins.forEach(p => (rooms[p.room || "Unassigned"] ||= []).push(p));
  const pk = (oid, k, cls) => { const o = optById(oid); return o ? `<div class="pk ${cls}"><div class="th"><img src="${esc(imgURL(o.img))}" alt=""></div><div style="min-width:0"><div class="k">${k}</div><div class="v">${esc(o.name)}</div><div class="p">${esc([o.vendor, o.price].filter(Boolean).join(" · "))}</div></div></div>`
    : `<div class="pk ${cls} none"><div class="th"></div><div><div class="k">${k}</div><div class="v">Not chosen</div></div></div>`; };
  return `<div class="lhead"><h2>Selection schedule</h2>${pins.length ? `<button class="btn" data-act="csv">Export CSV</button><button class="btn gold" data-act="report">Make report</button>` : ""}</div>
  <div class="stats"><div class="stat"><b>${pins.length}</b><span>pieces tagged</span></div><div class="stat"><b>${f}<span class="hint" style="font-size:18px">/${pins.length}</span></b><span>with a first pick</span></div>
    <div class="stat"><b>${b}<span class="hint" style="font-size:18px">/${pins.length}</span></b><span>with a backup</span></div><div class="stat"><b>${money(tot)}</b><span>first picks, list price</span></div><div class="stat"><b>${money(totB)}</b><span>if every backup is used</span></div></div>
  ${pins.length ? Object.entries(rooms).map(([r, list]) => `<div class="room"><h3>${esc(r)}</h3>${list.map(p => `<div class="srow"><button class="tg" data-act="openpin" data-id="${esc(p.id)}">${tagOf(p.n)}</button><div style="min-width:0">
    <div class="it">${esc(p.item || "Untitled")}${(p.qty || 1) > 1 ? `<small>× ${p.qty}</small>` : ""}${p.notes ? `<small>${esc(p.notes)}</small>` : ""}</div>
    <div class="picks">${pk(p.first, "First pick", "")}${pk(p.backup, "Backup", "b")}</div></div></div>`).join("")}</div>`).join("")
    : `<div class="empty"><p>Tag pieces on the plan to build the schedule.</p></div>`}`;
}

/* ================= tag detail sheet ================= */
function openSheet(id) {
  const p = pinById(id); if (!p) { S.pendingSheet = id; return; }
  S.sheetPin = id; closePop();
  const rooms = [...new Set(S.pins.map(x => x.room).filter(Boolean))];
  $("#layer2").innerHTML = `<div class="scrim" data-act="closesheet"></div><div class="sheet" role="dialog" aria-label="${tagOf(p.n)}">
    <div class="sh"><span class="tagid">${tagOf(p.n)}</span><span class="st s${pstate(p)}" id="pst"><i></i>${stateLabel(p)}</span><span class="sp"></span><button class="btn sm" data-act="closesheet">Done</button></div>
    <div class="sb">
      <input class="ptitle" id="pf-item" list="dl-cats" value="${esc(p.item)}" placeholder="Name this piece" data-pf="item" aria-label="Piece">
      <div class="two"><label class="fld"><span class="cap">Room</span><input id="pf-room" list="dl-rooms" value="${esc(p.room)}" placeholder="Living" data-pf="room"></label>
        <label class="fld"><span class="cap">Qty</span><input id="pf-qty" type="number" min="1" inputmode="numeric" value="${p.qty || 1}" data-pf="qty"></label></div>
      <div id="slots"></div>
      <label class="fld"><span class="cap">Notes</span><textarea id="pf-notes" data-pf="notes" placeholder="Fabric, finish, size, lead time">${esc(p.notes)}</textarea></label>
      <div id="pindel" class="row"><button class="btn sm danger" data-act="askdelpin">Delete tag</button><span class="hint">Drag a tag on the plan to move it.</span></div>
    </div></div>
    <datalist id="dl-cats">${CATS.map(c => `<option value="${c}">`).join("")}</datalist><datalist id="dl-rooms">${rooms.map(c => `<option value="${esc(c)}">`).join("")}</datalist>`;
  refreshSheet(); renderTags();
}
function slotHTML(p, key, label) {
  const o = optById(p[key]);
  return `<div class="slot ${key === "backup" ? "b" : ""}"><div class="sl"><span class="cap">${label}</span><span class="sp"></span>${o ? `<button class="btn sm quiet" data-act="clearslot" data-slot="${key}">Clear</button>` : ""}</div>
    ${o ? `<button class="sc" data-act="pick" data-slot="${key}"><div class="th"><img src="${esc(imgURL(o.img))}" alt=""></div><div style="min-width:0"><div class="nm">${esc(o.name)}</div><div class="mt">${esc([o.vendor, o.price].filter(Boolean).join(" · "))}</div><div class="mt" style="margin-top:4px;color:var(--body)">Tap to change</div></div></button>`
      : `<button class="choose" data-act="pick" data-slot="${key}">Choose ${label.toLowerCase()} <span>from the library →</span></button>`}</div>`;
}
function refreshSheet() {
  if (!S.sheetPin) return; const p = pinById(S.sheetPin);
  if (!p) { closeSheet(); return; }
  const sl = $("#slots"); if (!sl) return;
  sl.innerHTML = `<div style="display:grid;gap:10px">${slotHTML(p, "first", "First pick")}${slotHTML(p, "backup", "Backup")}
    ${p.first || p.backup ? `<button class="btn sm quiet" data-act="swap" style="justify-self:start">⇅ Swap first and backup</button>` : ""}</div>`;
  const st = $("#pst"); if (st) { st.className = "st s" + pstate(p); st.innerHTML = `<i></i>${stateLabel(p)}`; }
}
function closeSheet() { if (!S.sheetPin) return; S.sheetPin = null; $("#layer2").innerHTML = ""; renderTags(); }
const pinDoc = id => dbFor(S.pid).doc(`projects/${S.pid}/pins/${id}`);
async function savePin(id, data) { try { await pinDoc(id).update(data); } catch (e) { toast("Couldn't save: " + errMsg(e)); } }
function focusPin(id) {
  const t = pinById(id); if (!t) return;
  if (S.tab !== "plan") { S.tab = "plan"; render(); }
  setTimeout(() => {
    if (S.view) { const { w, h } = vpSize(), { bw, bh } = baseSize(); S.view.z = Math.max(S.view.z, 2); S.view.x = w / 2 - t.x * bw * S.view.z; S.view.y = (h - 120) / 2 - t.y * bh * S.view.z; applyView(); }
    openSheet(id);
  }, 30);
}

/* ================= popovers: projects, rooms, settings, list ================= */
function closePop() { $("#pop")?.remove(); $("#popscrim")?.remove(); }
function showPop(html, anchor, place = "below") {
  closePop();
  const sc = document.createElement("div"); sc.className = "scrim"; sc.id = "popscrim"; sc.style.background = "transparent"; sc.dataset.act = "closepop";
  const p = document.createElement("div"); p.className = "pop"; p.id = "pop"; p.innerHTML = html;
  document.body.append(sc, p);
  const r = anchor.getBoundingClientRect(), pw = p.offsetWidth, ph = p.offsetHeight;
  let left = Math.min(Math.max(12, r.left + r.width / 2 - pw / 2), innerWidth - pw - 12);
  if (place === "left-below") left = Math.max(12, Math.min(r.left, innerWidth - pw - 12));
  if (place === "right-below") left = Math.max(12, r.right - pw);
  p.style.left = left + "px";
  p.style.top = (place === "above" ? Math.max(12, r.top - ph - 10) : r.bottom + 8) + "px";
  p.querySelector("input[autofocus]")?.focus();
}
function openProjectMenu() {
  const p = proj();
  showPop(`<div class="cap">Projects</div>
    ${[...S.mainProjects].reverse().map(x => `<button class="mi" data-act="pickproj" data-id="${esc(x.id)}" aria-current="${x.id === S.pid}">${esc(x.name)}</button>`).join("")}

async function uploadSources(files) {
  for (const f of files) {
    const isPdf = f.type === "application/pdf" || /\.pdf$/i.test(f.name);
    if (!isPdf && !f.type.startsWith("image/")) { toast(`${f.name} isn't a PDF or an image.`); continue; }
    if (S.mode === "cloud" && f.size > 20 * 1024 * 1024) { toast(`${f.name} is over 20 MB. Split it or export at a lower resolution.`, 4200); continue; }
    toast(`Adding ${f.name}…`, 6000);
    try {
      const pages = isPdf ? (await openPdfData(await f.arrayBuffer())).numPages : 1;
      const ref = await putBlob(f);
      await dbFor(S.pid).doc(`projects/${S.pid}/sources/${uid()}`).set({ name: f.name, kind: isPdf ? "pdf" : "image", file: ref, pages, createdAt: Date.now() });
      toast(`${f.name} added · ${pages} page${pages > 1 ? "s" : ""}`);
    } catch (e) { toast(`Couldn't add ${f.name}: ${errMsg(e)}`, 4200); }
  }
}
async function uploadPlan(f) {

      toast("Rendering the plan…", 8000);
      const pg = await pdf.getPage(page), v1 = pg.getViewport({ scale: 1 }), vp = pg.getViewport({ scale: Math.min(3200 / v1.width, 6) });
      canvas = document.createElement("canvas"); canvas.width = Math.ceil(vp.width); canvas.height = Math.ceil(vp.height);
      const ctx = canvas.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
      await pg.render({ canvasContext: ctx, viewport: vp }).promise;
    } else {

      canvas = document.createElement("canvas"); canvas.width = im.naturalWidth; canvas.height = im.naturalHeight;
      const ctx = canvas.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.drawImage(im, 0, 0);
      URL.revokeObjectURL(url); canvas = scaleCanvas(canvas, 3600);

    const ref = await putBlob(await toBlob(canvas, "image/jpeg", .92));
    await dbFor(S.pid).doc(`projects/${S.pid}`).update({ plan: { img: ref, w: canvas.width, h: canvas.height } });
    if (old) delBlob(old);
    S.view = null; S.tagging = true; render();
    toast("Plan added. Tap each piece to tag it.", 3200);

/* ================= files out: CSV + backups ================= */
async function saveFile(filename, data, type) {
  if (IS_ARTIFACT) {
    if (!S.downloads) { toast("Saving files isn't available in this view."); return; }
    try { await S.downloads.save({ filename, data }); } catch (e) { if (e.code !== "declined") toast("Couldn't save the file: " + errMsg(e)); }
    return;
  }
  const url = URL.createObjectURL(new Blob([data], { type })), a = document.createElement("a");
  a.href = url; a.download = filename; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
}
const slug = s => (s || "project").replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-");
function downloadCSV() {
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const rows = [["Tag","Room","Piece","Qty","First pick","First vendor","First price","First link","Backup","Backup vendor","Backup price","Backup link","Notes"]];
  S.pins.forEach(p => { const a = optById(p.first) || {}, b = optById(p.backup) || {}; rows.push([tagOf(p.n), p.room, p.item, p.qty || 1, a.name, a.vendor, a.price, a.link, b.name, b.vendor, b.price, b.link, p.notes]); });

}
async function exportProject() {
  closePop(); const p = proj(); toast("Packing the backup…", 8000);
  try {
    const refs = new Set([p.plan?.img, ...S.options.map(o => o.img), ...S.sources.map(s => s.file)].filter(r => r && !r.startsWith("data:")));
    const files = {};
    for (const r of refs) { const b = await (await fetch(imgURL(r))).blob(); files[r] = { type: b.type, data: await blobToB64(b) }; }
    const strip = ({ id, ...rest }) => ({ id, ...rest });
    const out = { format: "plan-picker", version: 1, savedAt: new Date().toISOString(), project: { name: p.name, plan: p.plan || null }, pins: S.pins.map(strip), options: S.options.map(strip), sources: S.sources.map(strip), files };
    await saveFile(slug(p.name) + ".planpicker.json", JSON.stringify(out), "application/json");
  } catch (e) { toast("Couldn't make the backup: " + errMsg(e), 4200); }
}
async function importProject(f) {
  try {
    const j = JSON.parse(await f.text()); if (j.format !== "plan-picker") throw new Error("that isn't a Plan Picker backup");
    toast("Opening the backup…", 10000);
    const map = {};
    for (const [r, v] of Object.entries(j.files || {})) { const bin = atob(v.data), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); map[r] = await putBlobFor(new Blob([u], { type: v.type })); }
    const m = r => r && map[r] ? map[r] : r, id = uid(), db = S.db, base = `projects/${id}`;
    await db.doc(base).set({ name: j.project.name + " (copy)", plan: j.project.plan ? { ...j.project.plan, img: m(j.project.plan.img) } : null, createdAt: Date.now() });
    for (const s of j.sources || []) { const { id: sid, ...d } = s; await db.doc(`${base}/sources/${sid}`).set({ ...d, file: m(d.file) }); }
    for (const o of j.options || []) { const { id: oid, ...d } = o; await db.doc(`${base}/options/${oid}`).set({ ...d, img: m(d.img) }); }
    for (const t of j.pins || []) { const { id: tid, ...d } = t; await db.doc(`${base}/pins/${tid}`).set(d); }

}
async function putBlobFor(blob) {
  if (S.mode === "cloud") { if (!S.assets) throw new Error("only editors of this page can upload files"); return (await S.assets.upload(blob)).id; }
  if (S.mode === "idb") return S.idb.putBlob(blob);
  const ref = "local:" + uid(); blobs[ref] = URL.createObjectURL(blob); return ref;
}

async function fitImage(src, bw, bh, bg = "#F7F4EE", pad = .06) {
  const c = document.createElement("canvas"); c.width = Math.round(bw); c.height = Math.round(bh);
  const x = c.getContext("2d"); x.fillStyle = bg; x.fillRect(0, 0, c.width, c.height);
  if (src) { try { const im = await loadImg(src), iw = im.naturalWidth || 400, ih = im.naturalHeight || 300, s = Math.min(c.width * (1 - 2 * pad) / iw, c.height * (1 - 2 * pad) / ih); x.drawImage(im, (c.width - iw * s) / 2, (c.height - ih * s) / 2, iw * s, ih * s); } catch (e) {} }
  return c.toDataURL("image/jpeg", .86);
}
async function planWithTags() {
  const p = proj(), im = await loadImg(imgURL(p.plan.img)), sc = Math.min(1, 2400 / Math.max(im.naturalWidth, im.naturalHeight));
  const c = document.createElement("canvas"); c.width = Math.round(im.naturalWidth * sc); c.height = Math.round(im.naturalHeight * sc);
  const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
  const h = Math.max(18, c.width * .02), fs = h * .5;
  x.font = `600 ${fs}px Helvetica, Arial, sans-serif`; x.textBaseline = "middle";
  for (const t of S.pins) {
    const label = tagOf(t.n), tw = x.measureText(label).width, w = tw + h * 1.25, cx = t.x * c.width, cy = t.y * c.height, st = pstate(t);
    x.beginPath(); x.roundRect ? x.roundRect(cx - w / 2, cy - h / 2, w, h, h / 2) : x.rect(cx - w / 2, cy - h / 2, w, h);
    x.fillStyle = st ? "#F5C928" : "#0B0A09"; x.fill(); x.lineWidth = Math.max(1, h * .06); x.strokeStyle = st ? "#0B0A09" : "#EFE8DA"; x.stroke();
    const dx = cx - w / 2 + h * .42; x.beginPath(); x.arc(dx, cy, h * .13, 0, 7);
    x.fillStyle = st === 2 ? "#5E7352" : st ? "#0B0A09" : "#0B0A09"; x.fill(); if (!st) { x.strokeStyle = "#EFE8DA"; x.lineWidth = h * .05; x.stroke(); }
    x.fillStyle = st ? "#0B0A09" : "#EFE8DA"; x.fillText(label, dx + h * .3, cy + h * .02);
  }
  return { data: c.toDataURL("image/jpeg", .9), w: c.width, h: c.height };
}

async function deleteProject() {
  const pid = S.pid, db = dbFor(pid), p = proj();
  try {
    const refs = [p.plan?.img, ...S.options.map(o => o.img), ...S.sources.map(s => s.file)];
    for (const c of ["pins", "options", "sources"]) { const snap = await db.collection(`projects/${pid}/${c}`).get(); for (const d of snap.docs) await db.doc(`projects/${pid}/${c}/${d.id}`).delete(); }
    await db.doc(`projects/${pid}`).delete(); refs.forEach(delBlob);
    store("pp.pid", null); closePop(); toast("Project deleted");
  } catch (e) { toast("Couldn't delete: " + errMsg(e)); }
}
async function deleteOption(id) {
  const db = dbFor(S.pid), o = optById(id);

    for (const p of S.pins) { const ch = {}; if (p.first === id) ch.first = ""; if (p.backup === id) ch.backup = ""; if (Object.keys(ch).length) await db.doc(`projects/${S.pid}/pins/${p.id}`).update(ch); }
    await db.doc(`projects/${S.pid}/options/${id}`).delete(); if (o) delBlob(o.img);

  } catch (e) { toast("Couldn't remove: " + errMsg(e)); }
}
async function deleteSource(id) {
  const s = S.sources.find(x => x.id === id);
  try { await dbFor(S.pid).doc(`projects/${S.pid}/sources/${id}`).delete(); if (s) delBlob(s.file); toast("Source removed. Pieces cut from it stay in the library."); }
  catch (e) { toast("Couldn't remove: " + errMsg(e)); }
}
function closeAll() { closePicker(); closePop(); $("#opted")?.remove(); $("#cropper")?.remove(); C = null; S.sheetPin = null; $("#layer2").innerHTML = ""; }

/* ================= events ================= */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-act],[data-tab]"); if (!t) return;
  if (t.dataset.tab) { if (S.tab === t.dataset.tab) return; S.tab = t.dataset.tab; S.tagging = false; S.tray = null; closeAll(); render(); return; }
  const a = t.dataset.act, id = t.dataset.id;
  switch (a) {
    case "closepop": closePop(); break;
    case "pickproj": closePop(); S.autoExample = false; openProject(id); break;
    case "replaceplan": closePop(); $("#fPlan").click(); break;
    case "askdelproj": $("#delzone").innerHTML = `<div class="confirm" style="padding:8px 12px">Delete “${esc(proj().name)}” with all its tags, pieces and files? <button class="btn sm gold" data-act="delproj">Delete</button><button class="btn sm quiet" data-act="closepop">Keep</button></div>`; break;
    case "delproj": deleteProject(); break;
    case "upplan": $("#fPlan").click(); break;
    case "upsrc": $("#fSrc").click(); break;
    case "tagmode": S.tagging = !S.tagging; if (!S.tagging) S.tray = null; $("#vp")?.classList.toggle("tagging", S.tagging); $("#coach") && ($("#coach").hidden = !S.tagging);
      t.setAttribute("aria-pressed", S.tagging); t.innerHTML = `<span class="ring"></span>${S.tagging ? "Done" : "Tag pieces"}`; renderTray(); break;
    case "zoomin": { const { w, h } = vpSize(); zoomAt(1.5, w / 2, h / 2); break; }
    case "zoomout": { const { w, h } = vpSize(); zoomAt(1 / 1.5, w / 2, h / 2); break; }
    case "fit": fitView(); break;
    case "labels": S.labels = !S.labels; t.setAttribute("aria-pressed", S.labels); renderTags(); break;
    case "paper": { const on = document.documentElement.classList.toggle("paper"); store("pp.paper", on ? "1" : null); t.setAttribute("aria-pressed", on); break; }
    case "roompick": openRoomPicker(t); break;
    case "setroom": S.room = t.dataset.v; store("pp.room", S.room || null); closePop(); $("#roomname").textContent = S.room || "Any"; break;
    case "list": openList(t); break;
    case "closelist": $("#layer2").innerHTML = ""; break;
    case "focuspin": $("#layer2").innerHTML = ""; focusPin(id); break;
    case "quickname": { const tid = S.tray, v = t.dataset.v; S.tray = null; renderTray(); await savePin(tid, { item: v }); break; }
    case "undotag": { const tid = S.tray; S.tray = null; renderTray(); try { await pinDoc(tid).delete(); } catch (err) { toast("Couldn't undo: " + errMsg(err)); } break; }
    case "opentray": { const tid = S.tray; S.tray = null; renderTray(); openSheet(tid); break; }
    case "openpin": openSheet(id); break;
    case "closesheet": closeSheet(); break;
    case "askdelpin": $("#pindel").innerHTML = `<div class="confirm">Delete ${tagOf(pinById(S.sheetPin).n)}? <button class="btn sm gold" data-act="delpin">Delete</button><button class="btn sm quiet" data-act="keeppin">Keep</button></div>`; break;
    case "keeppin": $("#pindel").innerHTML = `<button class="btn sm danger" data-act="askdelpin">Delete tag</button><span class="hint">Drag a tag on the plan to move it.</span>`; break;
    case "delpin": { const pid = S.sheetPin, n = pinById(pid); closeSheet(); try { await pinDoc(pid).delete(); toast(`${tagOf(n.n)} deleted`, 4000, { label: "Undo", fn: () => { const { id: _, ...d } = n; pinDoc(pid).set(d); } }); } catch (err) { toast("Couldn't delete: " + errMsg(err)); } break; }
    case "pick": openPicker(t.dataset.slot); break;
    case "clearslot": savePin(S.sheetPin, { [t.dataset.slot]: "" }); break;
    case "swap": { const p = pinById(S.sheetPin); savePin(p.id, { first: p.backup || "", backup: p.first || "" }); break; }
    case "choose": { const p = pinById(S.sheetPin), slot = S.picker.slot, other = slot === "first" ? "backup" : "first", ch = { [slot]: id }; if (p[other] === id) ch[other] = p[slot] || ""; closePicker(); savePin(p.id, ch); break; }
    case "closepicker": closePicker(); break;
    case "golibrary": closeAll(); S.tab = "library"; render(); break;
    case "editopt": openOptEditor(id); break;
    case "closeopted": $("#opted")?.remove(); break;
    case "askdelopt": $("#optdel").innerHTML = `<div class="confirm">Remove this piece? Tags using it go back to open. <button class="btn sm gold" data-act="delopt" data-id="${esc(id)}">Remove</button><button class="btn sm quiet" data-act="closeopted">Keep</button></div>`; break;
    case "delopt": deleteOption(id); break;
    case "askdelsrc": $("#dz-" + CSS.escape(id)).innerHTML = `<span class="confirm">Remove this PDF? <button class="btn sm gold" data-act="delsrc" data-id="${esc(id)}">Remove</button></span>`; break;
    case "delsrc": deleteSource(id); break;
    case "crop": openCropper(id, +t.dataset.page); break;
    case "cpage": openCropper(C.src.id, C.page + (+t.dataset.d)); break;
    case "closecrop": C = null; $("#cropper")?.remove(); break;
    case "savecrop": saveCurrentCrop(); break;
    case "wholepage": if (C?.full) { C.box = [0, 0, 1, 1]; drawBoxes(); } break;
    case "aifind": aiFind(); break;
    case "useprop": { const p = C.props[+t.dataset.i]; C.box = p.box.slice(); C.activeProp = p; $("#cf-name").value = p.name; $("#cf-cat").value = p.category; $("#cf-vendor").value = p.vendor; $("#cf-price").value = p.price; drawBoxes(); break; }
    case "addallprops": addAllProps(); break;
    case "csv": downloadCSV(); break;
    case "report": closePop(); openReportDialog(); break;
    case "closereport": $("#reportdlg")?.remove(); break;
    case "makereport": makeReport(); break;
    case "export": exportProject(); break;
    case "import": closePop(); $("#fImport").click(); break;
    case "theme": { const v = t.dataset.v; store("pp.theme", v === "system" ? null : v); applyTheme(); closePop(); break; }
    case "clearkey": store("pp.key", null); closePop(); toast("Key removed"); break;
  }
});
$("#projbtn").addEventListener("click", openProjectMenu);
$("#setbtn").addEventListener("click", openSettings);
document.addEventListener("submit", async e => {
  const f = e.target.dataset.form; if (!f) return; e.preventDefault();
  if (f === "newproj") {
    const name = $("#np-name").value.trim(); if (!name) { $("#np-name").focus(); return; }
    const id = uid();
    try { await S.db.doc(`projects/${id}`).set({ name, plan: null, createdAt: Date.now() }); closePop(); S.tab = "plan"; S.autoExample = false; openProject(id); }
    catch (err) { toast("Couldn't create the project: " + errMsg(err)); }
  } else if (f === "rename") {
    const name = $("#rn-name").value.trim(); if (!name) return;
    try { await dbFor(S.pid).doc(`projects/${S.pid}`).update({ name }); closePop(); } catch (err) { toast("Couldn't rename: " + errMsg(err)); }
  } else if (f === "room") {
    const v = $("#nr").value.trim(); if (!v) return; S.room = v; store("pp.room", v); closePop(); $("#roomname").textContent = v;
  } else if (f === "key") {
    const v = $("#apikey").value.trim(); store("pp.key", v || null); closePop(); toast(v ? "Key saved in this browser" : "Key removed");
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.pf && S.sheetPin) { let v = t.value.trim(); if (t.dataset.pf === "qty") v = Math.max(1, parseInt(v) || 1); savePin(S.sheetPin, { [t.dataset.pf]: v }); }
  if (t.dataset.of) { const id = $("#opted")?.dataset.id; if (id) dbFor(S.pid).doc(`projects/${S.pid}/options/${id}`).update({ [t.dataset.of]: t.value.trim() }).catch(err => toast("Couldn't save: " + errMsg(err))); }
  if (t.id === "fPlan" && t.files[0]) { uploadPlan(t.files[0]); t.value = ""; }
  if (t.id === "fSrc" && t.files.length) { uploadSources([...t.files]); t.value = ""; }
  if (t.id === "fImport" && t.files[0]) { importProject(t.files[0]); t.value = ""; }
});
document.addEventListener("input", e => { if (e.target.id === "pk-q" && S.picker) { S.picker.q = e.target.value; refreshPicker(); } });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if ($("#pop")) closePop(); else if ($("#picker")) closePicker(); else if ($("#cropper")) { C = null; $("#cropper").remove(); }
  else if ($("#opted")) $("#opted").remove(); else if (S.sheetPin) closeSheet(); else if (S.tray) { S.tray = null; renderTray(); }
  else if ($("#layer2").innerHTML) $("#layer2").innerHTML = "";
});
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { drawDust(); if (S.tab === "plan" && S.view) { applyView(); renderTags(); } }, 120); });
function applyTheme() {
  if (IS_ARTIFACT) return; const t = recall("pp.theme");
  if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme");
  const dark = t ? t === "dark" : !matchMedia("(prefers-color-scheme: light)").matches;
  document.querySelector('meta[name="theme-color"]')?.setAttribute("content", dark ? "#0B0A09" : "#E8E2D7");
  drawDust();
}
matchMedia("(prefers-color-scheme: light)").addEventListener?.("change", applyTheme);

/* ================= boot ================= */
if (recall("pp.paper")) document.documentElement.classList.add("paper");
applyTheme(); drawDust(); render();
S.ex.collection("projects").onSnapshot(s => { S.exProjects = toList(s); if (S.ready) mergeProjects(); });
(async () => {
  if (IS_ARTIFACT) {
    const use = n => window.claude.use(n).catch(() => null);
    const [db, assets, sample, downloads] = await Promise.all([use("db"), use("assets"), use("sample"), use("downloads")]);
    S.assets = assets; S.sample = sample; S.downloads = downloads;
    if (sample) { try { const l = await sample.limits(); S.aiOK = !!(l && l.images); } catch (e) {} }
    if (db) { S.mode = "cloud"; S.db = db; } else { S.mode = "memory"; S.db = makeMemDB(); }
  } else {
    try { const idb = await makeIDB(); await idb.loadBlobs(); S.idb = idb; S.db = idb.db; S.mode = "idb"; navigator.storage?.persist?.().catch(() => {}); }
    catch (e) { S.mode = "memory"; S.db = makeMemDB(); }
    if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
  }
  S.ready = true; S.autoExample = true;
  S.db.collection("projects").onSnapshot(s => { S.mainProjects = toList(s); mergeProjects(); }, e => toast("Couldn't load projects: " + errMsg(e)));
})();
})();
</script>
